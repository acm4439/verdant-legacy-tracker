<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Memorial Park Leaf Icon</title>
  <desc id="desc">Leaf outline similar to the Lucide Leaf icon, used as the favicon.</desc>
  <!-- Background circle, matching the green gradient used behind the Leaf icon in the login page -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />
  <!-- Leaf outline (styled to resemble Lucide's Leaf: stroke-only, rounded caps/joins) -->
  <g transform="translate(8,8)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main leaf shape -->
    <path d="M16 3c5 0 9.5 1.8 13 5.3C32.5 11.8 34 16.5 34 22c0 5.5-2 9.8-6 13C24 38.2 20 40 16 40 12 40 9 39 7 37s-3-4-3-7c0-6 2-11.2 6-15.7C13 9.8 14.5 8.5 16 7" />
    <!-- Vein -->
    <path d="M16 40C16 30 19 21 26 14" />
  </g>
</svg>


